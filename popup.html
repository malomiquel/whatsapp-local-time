<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WhatsApp Local Time</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>🕒 Local time</h1>

  <label class="toggle">
    <input type="checkbox" id="per-message">
    <span>Show their time on each message</span>
  </label>

  <h2>Saved time zones</h2>
  <ul id="people"></ul>
  <p id="empty" class="hint" hidden>
    None yet. In WhatsApp Web, click the 🕒 clock in a chat header to set the time zone of a contact or of
    group members.
  </p>

  <script src="timezones.js"></script>
  <script src="popup.js"></script>
</body>
</html>
